# Host nginx reverse proxy for the chatbot, alongside your existing sites.
# Replace __API_DOMAIN__ and __APP_DOMAIN__ with your real subdomains, then:
#   sudo cp deploy/nginx-chatbot.conf /etc/nginx/sites-available/chatbot
#   sudo ln -s /etc/nginx/sites-available/chatbot /etc/nginx/sites-enabled/chatbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d __API_DOMAIN__ -d __APP_DOMAIN__   # adds HTTPS
#
# (sites-available files are included inside nginx's http{} block, so the map
#  directive below is valid here.)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# API + widget.js + WebSockets  ->  api container
server {
    listen 80;
    server_name __API_DOMAIN__;

    client_max_body_size 50m;        # allow document uploads

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # WebSocket upgrade
        proxy_set_header Connection $connection_upgrade; # (handoff /ws/*)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;     # long-lived SSE / streaming / WS
        proxy_buffering off;         # stream tokens through immediately
    }
}

# Dashboard (static SPA)  ->  web container
server {
    listen 80;
    server_name __APP_DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
